<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>PrintCraft</title>
  <meta name="description" content="Make greeting cards, signs, banners, labels and more, then print them at home.">
  <meta name="theme-color" content="#f4b34a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- Trunk builds the Rust app into WebAssembly -->
  <link data-trunk rel="rust" href="../Cargo.toml" data-bin="printcraft" />
  <link data-trunk rel="copy-dir" href="icons" />
  <link data-trunk rel="copy-file" href="favicon.png" />
  <link data-trunk rel="copy-file" href="manifest.webmanifest" />
  <link data-trunk rel="copy-file" href="sw.js" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fbf6ec; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
               font: 16px system-ui, sans-serif; color: #5b5146; gap: 12px; }
    #loading img { width: 96px; height: 96px; }
    @media (prefers-color-scheme: dark) { html, body { background: #2a2230; } #loading { color: #e9dfd2; } }
  </style>
</head>
<body>
  <canvas id="printcraft"></canvas>
  <div id="loading"><img src="icons/icon-192.png" alt=""><p>Loading PrintCraft…</p></div>
  <script>
    if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js"); }
  </script>
</body>
</html>
